[project]
name = "gw2craft"
version = "0.1.0"
description = "Find profitable Guild Wars 2 crafting recipes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
gw2craft = "gw2craft.cli:app"

[project.optional-dependencies]
ui = [
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
